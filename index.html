<style>
:root{--bg:#313338;--bg2:#2b2d31;--bg3:#1e1f22;--tx:#dbdee1;--mu:#949ba4;--ac:#5865f2;--ok:#23a55a;--er:#f23f43;--hv:#3f4147;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff;--bg2:#f2f3f5;--bg3:#e3e5e8;--tx:#2e3338;--mu:#5c6068;--hv:#d7d9dd;color-scheme:light}}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
#auth{height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#5865f2,#3b2b8c);padding:16px}
.card{background:var(--bg);border-radius:8px;padding:28px;width:100%;max-width:400px;box-shadow:0 8px 30px #0006}
.card h1{margin:0 0 4px;text-align:center}.card p{color:var(--mu);text-align:center;margin:0 0 18px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:8px;border-radius:4px;background:var(--bg2);color:var(--mu)}
.tabs button.on{background:var(--ac);color:#fff}
label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin:10px 0 6px;text-transform:uppercase}
input{width:100%;padding:10px;border-radius:4px;border:0;background:var(--bg3);outline:0}
.btn{width:100%;margin-top:16px;padding:11px;border-radius:4px;background:var(--ac);color:#fff;font-weight:600}
.err{color:var(--er);font-size:13px;min-height:18px;margin-top:8px}
#app{height:100%;display:none;grid-template-columns:72px 240px 1fr 220px}
.col{min-height:0;display:flex;flex-direction:column}
#srv{background:var(--bg3);align-items:center;padding:12px 0;gap:8px;overflow:auto}
.si{width:48px;height:48px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;transition:.15s}
.si:hover,.si.on{background:var(--ac);border-radius:16px;color:#fff}
#chs{background:var(--bg2)}
.hd{padding:14px;font-weight:700;border-bottom:1px solid var(--bg3);display:flex;justify-content:space-between;align-items:center}
.list{flex:1;overflow:auto;padding:8px}
.ch{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:4px;background:none;color:var(--mu);margin-bottom:2px}
.ch:hover{background:var(--hv)}.ch.on{background:var(--hv);color:var(--tx)}
.cat{font-size:12px;font-weight:700;color:var(--mu);margin:12px 6px 4px;text-transform:uppercase}
.me{display:flex;align-items:center;gap:8px;padding:8px;background:var(--bg3)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;transition:box-shadow .15s}
.talk{box-shadow:0 0 0 3px #f5c518,0 0 14px 2px #f5c518aa}.tile.talk{box-shadow:none;outline:3px solid #f5c518;outline-offset:-3px}
.me span{flex:1;overflow:hidden;text-overflow:ellipsis}#mav{cursor:pointer}
.ib{background:none;color:var(--mu);padding:6px;border-radius:4px}.ib:hover{background:var(--hv)}
#main{background:var(--bg)}
#msgs{flex:1;overflow:auto;padding:16px}
.m{display:flex;gap:12px;margin-bottom:14px}.m b{margin-right:8px}.m small{color:var(--mu)}
.m p{margin:2px 0 0;word-break:break-word}
#inp{padding:0 16px 16px;display:flex;gap:6px;align-items:center}#mi{flex:1;min-width:0}#att{font-size:20px}
#voice{display:none;flex:1;flex-direction:column;min-height:0;background:var(--bg3)}
#grid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;padding:12px;overflow:auto;align-content:center}
.tile{position:relative;background:#000;border-radius:8px;aspect-ratio:16/9;overflow:hidden;display:grid;place-items:center}
.tile video{width:100%;height:100%;object-fit:contain}
.tile .tag{position:absolute;left:8px;bottom:8px;background:#000a;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px}
#bar{display:flex;justify-content:center;gap:10px;padding:12px;flex-wrap:wrap}
.cb{padding:10px 16px;border-radius:24px;background:var(--bg2);font-weight:600}
.cb.on{background:var(--ok);color:#fff}.cb.red{background:var(--er);color:#fff}
#mem{background:var(--bg2)}
.mm{display:flex;align-items:center;gap:8px;padding:6px 8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);margin-left:auto}
#note{padding:6px 12px;color:var(--mu);font-size:12px;text-align:center}
@media(max-width:820px){#app{grid-template-columns:60px 1fr}#mem,#chs{display:none}#chs.show{display:flex;position:fixed;left:60px;top:0;bottom:0;width:220px;z-index:5}#menu{display:inline-block!important}}
#menu{display:none}
</style>
</head>
<body>
<div id="auth"><div class="card">
<h1>Concord</h1><p>Converse, compartilhe tela e fale por câmera.</p>
<div class="tabs"><button id="tIn" class="on">Entrar</button><button id="tUp">Criar conta</button></div>
<label>Nome de usuário</label><input id="u" autocomplete="username" maxlength="20">
<label>Senha</label><input id="p" type="password" autocomplete="current-password">
<div id="c2" style="display:none"><label>Confirmar senha</label><input id="p2" type="password"></div>
<div class="err" id="err"></div>
<button class="btn" id="go">Entrar</button>
</div></div>

<div id="app">
<div class="col" id="srv"></div>
<div class="col" id="chs"><div class="hd"><span id="sn"></span><button class="ib" id="addch" title="Novo canal">＋</button></div><div class="list" id="chl"></div>
<div class="me"><div class="av" id="mav" title="Trocar foto de perfil"></div><input type="file" id="pf" accept="image/*" hidden><span id="mn"></span><button class="ib" id="bot" title="Meus bots e chaves">🤖</button><button class="ib" id="out" title="Sair">⎋</button></div></div>
<div class="col" id="main">
<div class="hd"><span><button class="ib" id="menu">☰</button> <span id="cn"></span></span></div>
<div id="msgs"></div>
<div id="inp"><button class="ib" id="att" title="Enviar imagem">📎</button><input id="mi" placeholder="Enviar mensagem (use @claude para chamar o Claude)"><input type="file" id="fi" accept="image/*" hidden></div>
<div id="voice"><div id="grid"></div><div id="bar">
<button class="cb" id="bMic">🎤 Microfone</button><button class="cb" id="bCam">📷 Câmera</button><button class="cb" id="bScr">🖥️ Compartilhar tela</button><button class="cb red" id="bLeave">Sair da chamada</button></div>
<div id="note">As pré-visualizações são locais. Para chamadas entre pessoas diferentes é necessário um servidor de sinalização.</div></div>
</div>
<div class="col" id="mem"><div class="hd">Membros</div><div class="list" id="ml"></div></div>
</div>

<div id="bm" style="display:none;position:fixed;inset:0;background:#000a;z-index:30;align-items:center;justify-content:center;padding:16px"><div class="card" style="max-width:460px;max-height:90vh;overflow:auto"><h1 style="font-size:20px">🤖 Meus bots e chaves</h1><p>Crie bots do Concord e gere a chave de cada um.</p><div id="bl"></div><label>Nome do bot</label><input id="bn" maxlength="20"><label>Personalidade (opcional, ativa a IA)</label><input id="bp" maxlength="300" placeholder="Ex.: pirata engraçado que responde em rimas"><div class="err" id="be"></div><button class="btn" id="bc">Criar bot e gerar chave</button><button class="btn" id="bx" style="background:var(--bg2);color:var(--tx)">Fechar</button></div></div>
<script>
const $=id=>document.getElementById(id);
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const COLORS=["#5865f2","#eb459e","#23a55a","#f0b232","#e67e22","#1abc9c","#9b59b6"];
const col=n=>n=="Claude"?"#d97757":COLORS[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
let mode="in",me=(s=>s&&typeof s=="object"&&s.e>Date.now()&&typeof s.n=="string"?s.n:null)(S.get("cc_session",null)),srvs,msgs,cur={s:0,c:0},media={cam:null,scr:null,mic:null},inCall=false;
async function hash(u,p){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("concord:"+u.toLowerCase()+":"+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return btoa(u+p)}}
function setMode(m){mode=m;$("tIn").className=m=="in"?"on":"";$("tUp").className=m=="up"?"on":"";$("c2").style.display=m=="up"?"block":"none";$("go").textContent=m=="in"?"Entrar":"Criar conta";$("err").textContent=""}
$("tIn").onclick=()=>setMode("in");$("tUp").onclick=()=>setMode("up");
async function submit(){
 const u=$("u").value.trim(),p=$("p").value,users=S.get("cc_users",{}),k=u.toLowerCase();
 if(mode=="up"&&[k.replace(/[^a-z0-9]/g,""),k.replace(/[^a-z]/g,""),k.replace(/[^a-z0-9@]/g,"").replace(/0/g,"o").replace(/1/g,"l").replace(/3/g,"e").replace(/4|@/g,"a").replace(/5/g,"s")].some(x=>x.includes("claude")))return $("err").textContent="Nomes com “claude” são reservados, com ou sem números.";
 if(mode=="up"&&!/^[A-Za-z0-9][A-Za-z0-9_.-]{2,19}$/.test(u))return $("err").textContent="Nome de 3 a 20 caracteres: letras, números, ponto, hífen ou _, começando com letra ou número.";if(u.length<3)return $("err").textContent="O nome precisa de pelo menos 3 caracteres.";
 if(mode=="up"){const w=pwWeak(p,u);if(w)return $("err").textContent=w}else if(!p)return $("err").textContent="Digite a senha.";
 if(!window.crypto||!crypto.subtle)return $("err").textContent="Este navegador não suporta criptografia segura.";const lk=S.get("cc_lock",{}),L=lk[k]||{n:0,t:0};if(mode=="in"&&L.t>Date.now())return $("err").textContent="Muitas tentativas. Aguarde "+Math.ceil((L.t-Date.now())/1000)+"s.";
 if(mode=="up"){
  if(p!==$("p2").value)return $("err").textContent="As senhas não coincidem.";
  if(Object.prototype.hasOwnProperty.call(users,k)||getBots().some(b=>b.name.toLowerCase()==k))return $("err").textContent="Esse nome já está em uso.";
  const salt=rnd(16);users[k]={name:u,s:salt,h:await pbk(p,salt),v:2};if(!S.set("cc_users",users))return $("err").textContent="Não foi possível salvar a conta (armazenamento cheio).";
 }else{
  const o=Object.prototype.hasOwnProperty.call(users,k)?users[k]:null;let ok=false;
  if(o&&o.v==2)ok=same(o.h,await pbk(p,o.s));
  else if(o){ok=same(o.h,await hash(u,p));if(ok){const s=rnd(16);o.s=s;o.h=await pbk(p,s);o.v=2;S.set("cc_users",users)}}
  else await pbk(p,rnd(16));
  if(!ok){L.n++;if(L.n>=5)L.t=Date.now()+Math.min(1800,30*2**(L.n-5))*1000;lk[k]=L;S.set("cc_lock",lk);return $("err").textContent="Usuário ou senha incorretos."}
  delete lk[k];S.set("cc_lock",lk);
 }
 me=users[k].name;S.set("cc_session",{n:me,e:Date.now()+7*864e5});start();
}
$("go").onclick=submit;[$("u"),$("p"),$("p2")].forEach(e=>e.onkeydown=ev=>{if(ev.key=="Enter")submit()});
$("out").onclick=()=>logout();
function logout(m){leave();me=null;S.set("cc_session",null);$("app").style.display="none";$("auth").style.display="flex";$("p").value="";$("p2").value="";$("msgs").innerHTML="";$("err").textContent=m||""}

function load(){srvs=S.get("cc_servers",null)||[{id:1,name:"Concord HQ",ch:[{id:"g1",n:"geral",t:"text"},{id:"g2",n:"aleatório",t:"text"},{id:"v1",n:"Sala de voz",t:"voice"}]}];msgs=S.get("cc_msgs",{});Object.keys(msgs).forEach(c=>{if(Array.isArray(msgs[c])&&msgs[c].length>300)msgs[c]=msgs[c].slice(-300)});srvs.forEach(s=>{if(!s.ch.some(c=>c.ai))s.ch.splice(1,0,{id:"ai"+s.id,n:"claude",t:"text",ai:1})});S.set("cc_servers",srvs)}
function start(){load();loadPics();bump();$("auth").style.display="none";$("app").style.display="grid";
 $("mn").textContent=me;paintMe();cur={s:0,c:0};render()}
function render(){
 $("srv").innerHTML="";
 srvs.forEach((s,i)=>{const b=document.createElement("button");b.className="si"+(i==cur.s?" on":"");b.textContent=s.name.slice(0,2).toUpperCase();b.title=s.name;b.onclick=()=>{cur={s:i,c:0};leave();render()};$("srv").appendChild(b)});
 const a=document.createElement("button");a.className="si";a.textContent="+";a.title="Criar servidor";a.onclick=()=>{const n=(prompt("Nome do servidor")||"").trim();if(!n)return;srvs.push({id:Date.now(),name:n,ch:[{id:"t"+Date.now(),n:"geral",t:"text"},{id:"v"+Date.now(),n:"Sala de voz",t:"voice"}]});S.set("cc_servers",srvs);cur={s:srvs.length-1,c:0};render()};$("srv").appendChild(a);
 const s=srvs[cur.s];$("sn").textContent=s.name;$("chl").innerHTML="";
 [["text","Canais de texto","#"],["voice","Canais de voz","🔊"]].forEach(([t,l,ic])=>{const d=document.createElement("div");d.className="cat";d.textContent=l;$("chl").appendChild(d);
  s.ch.forEach((c,i)=>{if(c.t!=t)return;const b=document.createElement("button");b.className="ch"+(i==cur.c?" on":"");b.textContent=ic+" "+c.n;b.onclick=()=>{if(inCall)leave();cur.c=i;render()};$("chl").appendChild(b)})});
 const c=s.ch[cur.c],v=c.t=="voice";$("cn").textContent=(v?"🔊 ":"# ")+c.n;
 $("msgs").style.display=v?"none":"block";$("inp").style.display=v?"none":"flex";$("voice").style.display=v?"flex":"none";
 $("chs").classList.remove("show");
 if(!v)drawMsgs();
 const us=Object.values(S.get("cc_users",{}));$("ml").innerHTML=`<div class="mm"><div class="av" data-ai="1" style="${avs("Claude")}">${avl("Claude")}</div>Claude <small style="background:var(--ac);color:#fff;border-radius:3px;padding:0 4px">BOT</small><span class="dot"></span></div>`+us.map(u=>`<div class="mm"><div class="av"${u.name.toLowerCase()==me.toLowerCase()?' data-me="1"':''} style="${avs(u.name)}">${avl(u.name)}</div>${esc(u.name)}<span class="dot"></span></div>`).join("")+getBots().map(b=>`<div class="mm"><div class="av" style="${avs(b.name)}">${avl(b.name)}</div>${esc(b.name)} <small style="background:var(--ac);color:#fff;border-radius:3px;padding:0 4px">BOT</small><span class="dot"></span></div>`).join("");paintTalk();
}
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function drawMsgs(){const id=srvs[cur.s].ch[cur.c].id,l=msgs[id]||[];
 $("msgs").innerHTML=l.length?l.map(m=>`<div class="m"><div class="av" style="${avs(m.u)}">${avl(m.u)}</div><div><b>${esc(m.u)}</b>${isBot(m.u)?'<small style="background:var(--ac);color:#fff;border-radius:3px;padding:0 4px;margin-right:6px">BOT</small>':""}<small>${new Date(m.ts).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</small>${m.t?`<p>${esc(m.t)}</p>`:""}${okImg(m.img)?`<img src="${m.img}" onclick="zoom(this.src)" style="max-width:min(100%,360px);max-height:300px;border-radius:6px;margin-top:4px;display:block;cursor:zoom-in">`:""}</div></div>`).join(""):`<p style="color:var(--mu)">Este é o começo de #${esc(srvs[cur.s].ch[cur.c].n)}.</p>`;
 if(typing==id)$("msgs").insertAdjacentHTML("beforeend",'<p style="color:var(--mu)">Claude está digitando…</p>');$("msgs").scrollTop=1e9}
$("mi").onkeydown=e=>{if(e.key!="Enter")return;const t=$("mi").value.trim().slice(0,2000);if(!t)return;if(!rate())return;const id=srvs[cur.s].ch[cur.c].id;(msgs[id]=msgs[id]||[]).push({u:me,t,ts:Date.now()});S.set("cc_msgs",msgs);$("mi").value="";drawMsgs();const ch=srvs[cur.s].ch[cur.c];const bt=getBots().find(b=>b.p&&new RegExp("@"+b.name.replace(/\./g,"\\.")+"(?![\\w.-])","i").test(t));if(bt)askClaude(id,bt);else if(ch.ai||/@claude/i.test(t))askClaude(id)};
let typing=null;
const getBots=()=>{const b=S.get("cc_bots",[]);return Array.isArray(b)?b:[]};
const isBot=n=>n=="Claude"||getBots().some(b=>b.name==n);
async function sha(s){return hx(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))}
const newKey=()=>"cnc_"+rnd(24);
function drawBots(shown){const l=getBots().filter(b=>b.o==me);
 $("bl").innerHTML=l.map(b=>`<div style="background:var(--bg2);border-radius:6px;padding:10px;margin-bottom:8px"><b>${esc(b.name)}</b> <small style="color:var(--mu)">chave ...${esc(b.l)}${b.p?" · IA":""}</small><br><button class="ib" data-r="${esc(b.id)}">🔄 Nova chave</button><button class="ib" data-d="${esc(b.id)}">🗑️ Excluir</button></div>`).join("")+(shown?`<div style="background:var(--bg3);padding:10px;border-radius:6px;margin-bottom:8px"><small>Copie agora, ela não será mostrada de novo:</small><input readonly value="${esc(shown)}" onclick="this.select()"></div>`:"")}
$("bl").onclick=async e=>{const r=e.target.dataset.r,d=e.target.dataset.d,bs=getBots();
 if(r){const b=bs.find(x=>x.id==r&&x.o==me);if(!b)return;const k=newKey();b.h=await sha(k);b.l=k.slice(-4);S.set("cc_bots",bs);drawBots(k)}
 if(d&&confirm("Excluir este bot?")){S.set("cc_bots",bs.filter(x=>!(x.id==d&&x.o==me)));drawBots();render()}};
$("bot").onclick=()=>{$("be").textContent="";$("bm").style.display="flex";drawBots()};
$("bx").onclick=()=>{$("bm").style.display="none";drawBots()};
$("bc").onclick=async()=>{const n=$("bn").value.trim(),p=$("bp").value.trim(),bs=getBots(),k0=n.toLowerCase();
 if(!/^[A-Za-z0-9][A-Za-z0-9_.-]{2,19}$/.test(n)||k0.replace(/[^a-z]/g,"").includes("claude"))return $("be").textContent="Nome de 3 a 20 caracteres (letras, números, . - _), sem “claude”.";
 if(bs.some(b=>b.name.toLowerCase()==k0)||Object.prototype.hasOwnProperty.call(S.get("cc_users",{}),k0))return $("be").textContent="Esse nome já está em uso.";
 if(bs.filter(b=>b.o==me).length>=5)return $("be").textContent="Limite de 5 bots por conta.";
 const k=newKey();bs.push({id:rnd(6),o:me,name:n,p,h:await sha(k),l:k.slice(-4)});
 if(!S.set("cc_bots",bs))return $("be").textContent="Armazenamento cheio.";
 $("bn").value="";$("bp").value="";$("be").textContent="";drawBots(k);render()};
async function viaWorker(arr,imgs){
 const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:arr,images:imgs})});
 if(r.status==429)throw {code:"rate_limited"};
 if(!r.ok)throw {code:"http"};
 const d=await r.json();return typeof d.text=="string"?d.text:"…"}
let talking=false,actx=null;
function paintTalk(){$("mav").classList.toggle("talk",talking);document.querySelectorAll(".tile").forEach(t=>t.classList.toggle("talk",talking));document.querySelectorAll("[data-me]").forEach(e=>e.classList.toggle("talk",talking));document.querySelectorAll("[data-ai]").forEach(e=>e.classList.toggle("talk",typing!==null))}
function setTalk(v){if(v!==talking){talking=v;paintTalk()}}
function watchMic(st){try{
 if(actx)actx.close();actx=new (window.AudioContext||window.webkitAudioContext)();actx.resume();
 const an=actx.createAnalyser();an.fftSize=512;actx.createMediaStreamSource(st).connect(an);
 const buf=new Uint8Array(an.fftSize);let last=0;
 const tick=()=>{if(!media.mic||!actx){setTalk(false);if(actx){actx.close();actx=null}return}
  an.getByteTimeDomainData(buf);let s=0;for(const v of buf){const d=(v-128)/128;s+=d*d}
  if(Math.sqrt(s/buf.length)>0.04)last=Date.now();setTalk(Date.now()-last<400);requestAnimationFrame(tick)};

let pics={claude:CPIC};
function loadPics(){pics={claude:CPIC};const u=S.get("cc_users",{});for(const k in u)if(okImg(u[k].pic))pics[k]=u[k].pic}
const avs=n=>{const p=pics[n.toLowerCase()];return p?`background:url('${p}') center/cover`:`background:${col(n)}`};
const avl=n=>pics[n.toLowerCase()]?"":esc(n[0].toUpperCase());
function paintMe(){$("mav").textContent=avl(me);$("mav").style.cssText=avs(me)}
$("mav").onclick=()=>$("pf").click();
$("pf").onchange=()=>{const f=$("pf").files[0];$("pf").value="";if(!f||!/^image\/(jpeg|png|webp|gif)$/.test(f.type)||f.size>10e6){alert("Envie uma imagem JPG, PNG, WebP ou GIF de até 10 MB.");return}
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=160;
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,160,160);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);
  const us=S.get("cc_users",{}),k=me.toLowerCase();if(!us[k])return;us[k].pic=c.toDataURL("image/jpeg",.85);
  if(!S.set("cc_users",us)){alert("O armazenamento do navegador está cheio.");return}
  loadPics();paintMe();render()};im.onerror=()=>alert("Não foi possível abrir essa imagem.");im.src=r.result};r.readAsDataURL(f)};
function dataBlob(d){const b=atob(d.split(",")[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:"image/jpeg"})}
function zoom(s){const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:20;cursor:zoom-out";d.innerHTML=`<img src="${s}" style="max-width:95%;max-height:95%">`;d.onclick=()=>d.remove();document.body.appendChild(d)}
function sendImg(f){
 if(!f||!/^image\/(jpeg|png|webp|gif)$/.test(f.type)||f.size>10e6){alert("Envie uma imagem JPG, PNG, WebP ou GIF de até 10 MB.");return}if(!rate())return;
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  const id=srvs[cur.s].ch[cur.c].id;(msgs[id]=msgs[id]||[]).push({u:me,t:"",img:c.toDataURL("image/jpeg",.75),ts:Date.now()});
  if(!S.set("cc_msgs",msgs)){msgs[id].pop();alert("O armazenamento do navegador está cheio. Não foi possível enviar a imagem.");return}
  drawMsgs();if(srvs[cur.s].ch[cur.c].ai)askClaude(id)};im.onerror=()=>alert("Não foi possível abrir essa imagem.");im.src=r.result};r.readAsDataURL(f)}
$("att").onclick=()=>$("fi").click();
$("fi").onchange=()=>{sendImg($("fi").files[0]);$("fi").value=""};
$("mi").onpaste=e=>{const f=[...(e.clipboardData?e.clipboardData.files:[])][0];if(f&&f.type.startsWith("image/")){e.preventDefault();sendImg(f)}};
async function askClaude(id,bot){
 typing=id;paintTalk();drawMsgs();let out;
 try{
  const sample=typeof claude!="undefined"?await claude.use("sample"):null;
  if(!sample&&!API)throw {code:"none"};
  const recent=(msgs[id]||[]).slice(-12),hist=recent.map(m=>m.u==(bot?bot.name:"Claude")?{role:"assistant",content:m.t}:{role:"user",content:m.u+": "+(m.t||"[enviou uma imagem]")});
  const imgs=[],lim=sample?await sample.limits():{images:true};
  if(lim&&lim.images)for(const m of recent.filter(m=>okImg(m.img)).slice(-3))imgs.push(sample?dataBlob(m.img):m.img);
  const arr=[];hist.forEach(h=>{const l=arr[arr.length-1];if(l&&l.role==h.role)l.content+="\n"+h.content;else arr.push(h)});
  while(arr.length&&arr[0].role!="user")arr.shift();
  arr[0].content="Você é o Claude, um assistente de IA dentro do Concord, um chat estilo Discord. Responda em português, de forma curta e amigável, sem markdown pesado. Cada mensagem de usuário começa com o nome de quem escreveu. Você pode receber imagens anexadas (as mais recentes do chat, em ordem); analise-as quando perguntarem.\n\n"+(bot?"Neste momento você está atuando como o bot "+bot.name+". Personalidade e regras definidas pelo dono: "+bot.p+"\n\n":"")+arr[0].content;
  out=sample?(await sample(arr,imgs.length?{cache:false,images:imgs}:{cache:false})).text:await viaWorker(arr,imgs);
 }catch(e){out=e&&e.code=="not_granted"?"Preciso da sua permissão para responder. Envie outra mensagem e aceite o pedido.":e&&e.code=="rate_limited"?"Muitas mensagens seguidas, tente de novo em instantes.":"Não consegui responder agora. O Claude só funciona na página publicada no claude.ai."}
 typing=null;paintTalk();(msgs[id]=msgs[id]||[]).push({u:bot?bot.name:"Claude",t:out||"…",ts:Date.now()});S.set("cc_msgs",msgs);if(srvs[cur.s].ch[cur.c].id==id)drawMsgs()}
$("addch").onclick=()=>{const n=(prompt("Nome do canal")||"").trim();if(!n)return;const v=confirm("Canal de voz? OK = voz, Cancelar = texto");srvs[cur.s].ch.push({id:"c"+Date.now(),n,t:v?"voice":"text"});S.set("cc_servers",srvs);render()};
$("menu").onclick=()=>$("chs").classList.toggle("show");
window.addEventListener("storage",e=>{if(!me)return;if(e.key=="cc_msgs"){msgs=S.get("cc_msgs",{});if(srvs[cur.s].ch[cur.c].t=="text")drawMsgs()}if(e.key=="cc_users"){loadPics();paintMe();render()}});

/* Chamadas: câmera, tela e microfone */
function tiles(){const g=$("grid");g.innerHTML="";
 [["cam","Câmera"],["scr","Tela"]].forEach(([k,l])=>{if(!media[k])return;const t=document.createElement("div");t.className="tile";const v=document.createElement("video");v.autoplay=true;v.muted=true;v.playsInline=true;v.srcObject=media[k];t.appendChild(v);const tg=document.createElement("div");tg.className="tag";tg.textContent="🔴 "+me+" · "+l;t.appendChild(tg);g.appendChild(t)});
 if(!g.children.length){const t=document.createElement("div");t.className="tile";t.innerHTML=`<div class="av" style="width:80px;height:80px;font-size:32px;${avs(me)}">${avl(me)}</div>`;g.appendChild(t)}
 $("bCam").className="cb"+(media.cam?" on":"");$("bScr").className="cb"+(media.scr?" on":"");$("bMic").className="cb"+(media.mic?" on":"");paintTalk()}
async function toggle(k){
 if(media[k]){media[k].getTracks().forEach(t=>t.stop());media[k]=null;return tiles()}
 try{
  media[k]=k=="scr"?await navigator.mediaDevices.getDisplayMedia({video:true,audio:true}):await navigator.mediaDevices.getUserMedia(k=="cam"?{video:true}:{audio:true});
  media[k].getVideoTracks().forEach(t=>t.onended=()=>{media[k]=null;tiles()});if(k=="mic")watchMic(media[k]);
 }catch(e){$("note").textContent="Não foi possível acessar: permita o acesso no navegador ("+(e.name||"erro")+").";media[k]=null}
 tiles()}
$("bCam").onclick=()=>toggle("cam");$("bScr").onclick=()=>toggle("scr");$("bMic").onclick=()=>toggle("mic");
function leave(){["cam","scr","mic"].forEach(k=>{if(media[k]){media[k].getTracks().forEach(t=>t.stop());media[k]=null}});inCall=false;talking=false;tiles()}
$("bLeave").onclick=()=>{leave();cur.c=srvs[cur.s].ch.findIndex(c=>c.t=="text");render()};
new MutationObserver(()=>{});
const vo=$("voice");let lastV=false;
setInterval(()=>{const v=srvs&&me&&srvs[cur.s].ch[cur.c].t=="voice";if(v&&!lastV){inCall=true;tiles()}lastV=v},300);

if(me&&Object.prototype.hasOwnProperty.call(S.get("cc_users",{}),me.toLowerCase()))start();else $("auth").style.display="flex";
